server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SvelteKit exportiert mit trailingSlash: immer ein Verzeichnis mit
    # index.html. Unbekannte Pfade bleiben ein echter 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Gehashte Bundles dürfen lange gecacht werden.
    location /_app/immutable/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
