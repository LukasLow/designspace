version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      svelte:
        patterns:
          - '@sveltejs/*'
          - 'svelte'
          - 'svelte-check'
      build:
        patterns:
          - 'vite'
          - 'typescript'
